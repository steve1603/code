name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover tests/ -v

      - name: GUI import / instantiation smoke check
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          from PySide6.QtWidgets import QApplication
          from finadvisor.gui.main_window import MainWindow
          app = QApplication([])
          w = MainWindow()
          for i in range(4):
              w.sidebar.setCurrentRow(i)
              w.pages.currentWidget().refresh()
          print('GUI instantiates cleanly across all pages.')
          "
